services:
  - type: web
    name: mira-backend
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: pip install -r requirements2.txt

    startCommand: python -m app.preflight && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: DEBUG
        value: "false"

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: MILVUS_ENABLED
        value: "false"

      - key: MODEL_AUTO_DOWNLOAD
        value: "false"

      - key: MODEL_HUB_ID
        value: "AshIndian/Mira.ai"

      - key: MIRA_MODEL_SERVER_URL
        sync: false

      - key: MIRA_API_KEY
        sync: false

      - key: SEED_ADMIN_EMAIL
        sync: false

      - key: SEED_ADMIN_PASSWORD
        sync: false

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"

      - key: SEED_DEMO_USERS
        value: "false"

  - type: web
    name: mira-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "22.12.0"

      - key: VITE_API_URL
        sync: false
